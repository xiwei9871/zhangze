server:
  port: 8080

spring:
  application:
    name: market-intelligence-api
  datasource:
    url: ${MARKET_DB_URL:jdbc:postgresql://127.0.0.1:5432/market_intelligence}
    username: ${MARKET_DB_USERNAME:market}
    password: ${MARKET_DB_PASSWORD:market}
  flyway:
    enabled: true
    locations: classpath:db/migration

market:
  intelligence:
    crawler-enabled: true
    crawler-fixed-delay-ms: 300000
    ai-summary-enabled: true
    push-enabled: true
    max-content-length: 12000
    request-timeout-seconds: 15
